<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Cadastro de Alunos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Sistema de Cadastro de Alunos</h1>
    <p>Cadastro simples desenvolvido com HTML, CSS, JavaScript e Git.</p>
  </header>

  <main>
    <section class="card">
      <h2>Cadastrar Aluno</h2>
      <form id="formAluno">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite o nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" placeholder="Digite o e-mail" required>

        <label for="curso">Curso:</label>
        <select id="curso" required>
          <option value="">Selecione o curso</option>
          <option value="Análise e Desenvolvimento de Sistemas">Análise e Desenvolvimento de Sistemas</option>
          <option value="Sistemas de Informação">Sistemas de Informação</option>
        </select>

        <button type="submit">Cadastrar</button>
      </form>
    </section>

    <section class="card">
      <h2>Alunos cadastrados</h2>
      <p id="mensagemVazia">Nenhum aluno cadastrado.</p>
      <ul id="listaAlunos"></ul>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
